<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dandara · Spring AI + Ollama</title>
  <link rel="icon" href="dandara.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Topo: nome do chat e botão de nova conversa -->
  <header class="topo">
    <div class="marca">
      <span class="logo" aria-hidden="true"><img src="dandara.png" alt=""></span>
      <div>
        <h1>Dandara</h1>
        <p class="subtitulo">Assistente financeiro</p>
      </div>
    </div>
    <button id="nova-conversa" class="botao-secundario" type="button">Nova conversa</button>
  </header>

  <!-- Área das mensagens: o JavaScript adiciona os balões aqui -->
  <main id="mensagens" aria-live="polite">
    <section id="boas-vindas" class="boas-vindas">
      <img class="foto-boas-vindas" src="dandara.png" alt="Dandara, a assistente financeira">
      <h2>Olá, eu sou a Dandara! Como posso ajudar com suas finanças?</h2>
      <p>Pergunte sobre orçamento, dívidas, investimentos ou benefícios.</p>
      <div class="sugestoes">
        <button type="button" class="sugestao">Como montar uma reserva de emergência?</button>
        <button type="button" class="sugestao">Como sair do rotativo do cartão de crédito?</button>
        <button type="button" class="sugestao">CDB ou Tesouro Selic: qual a diferença?</button>
        <button type="button" class="sugestao">Vale a pena antecipar parcelas de um financiamento?</button>
      </div>
    </section>
  </main>

  <!-- Caixa de envio da pergunta -->
  <footer class="rodape">
    <form id="form-chat" class="caixa">
      <button type="button" class="icone" disabled title="Enviar imagem (em breve)" aria-label="Enviar imagem (em breve)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <textarea id="pergunta" rows="1" placeholder="Pergunte sobre finanças…" aria-label="Sua pergunta"></textarea>
      <button type="button" class="icone" disabled title="Falar (em breve)" aria-label="Falar (em breve)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" id="enviar" class="enviar">Enviar</button>
    </form>
    <p class="aviso">A Dandara é uma assistente de  educação financeira.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
